services:
  apkpipe:
    image: ghcr.io/spelech/apkpipe:latest
    container_name: apkpipe
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8429:8000"
    environment:
      - APKPIPE_APP_NAME=APKPipe
      - APKPIPE_DEBUG=false
      - APKPIPE_HOST=0.0.0.0
      - APKPIPE_PORT=8000
      - APKPIPE_DATABASE_URL=sqlite+aiosqlite:////data/apkpipe.db
      - APKPIPE_DOWNLOAD_DIR=/downloads
      - APKPIPE_STAGING_DIR=/data/staging
      - APKPIPE_POLL_INTERVAL_SECONDS=900
      - APKPIPE_REAL_DEBRID_API_TOKEN=${APKPIPE_REAL_DEBRID_API_TOKEN:-}
      - APKPIPE_ALLDEBRID_API_KEY=${APKPIPE_ALLDEBRID_API_KEY:-}
      - APKPIPE_ALLDEBRID_AGENT=${APKPIPE_ALLDEBRID_AGENT:-apkpipe}
      - APKPIPE_JDOWNLOADER_EMAIL=${APKPIPE_JDOWNLOADER_EMAIL:-}
      - APKPIPE_JDOWNLOADER_PASSWORD=${APKPIPE_JDOWNLOADER_PASSWORD:-}
      - APKPIPE_JDOWNLOADER_DEVICE_NAME=${APKPIPE_JDOWNLOADER_DEVICE_NAME:-APKPipe-JD2}
      - APKPIPE_JDOWNLOADER_WATCH_DIR=/data/jd_watch
      - APKPIPE_SCRAPER_URL=${APKPIPE_SCRAPER_URL:-http://scraper:8080}
      - APKPIPE_NEXTCLOUD_URL=${APKPIPE_NEXTCLOUD_URL:-http://nextcloud:80}
      - APKPIPE_NEXTCLOUD_TOKEN=${APKPIPE_NEXTCLOUD_TOKEN:-}
      - APKPIPE_NEXTCLOUD_OCC_COMMAND=${APKPIPE_NEXTCLOUD_OCC_COMMAND:-docker exec nextcloud sudo -u abc php /config/www/nextcloud/occ files:scan --path="{path}"}
      - APKPIPE_APPRISE_URL=${APKPIPE_APPRISE_URL:-http://apprise:8000/notify/apprise}
      - APKPIPE_NTFY_TOPIC=${APKPIPE_NTFY_TOPIC:-apkpipe-alerts}
    volumes:
      - ./data:/data
      - /drives/nextcloud/nextcloud_data/steve/files/APKs:/downloads
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # What's Up Docker (WUD) Auto-Update & Monitoring
      wud.watch: "true"
      wud.display.name: "APKPipe"
      wud.tag.include: "^latest$$"
      wud.link.template: "https://github.com/spelech/apkpipe/releases"

      # TinyAuth Access Control
      tinyauth.apps.apkpipe.config.domain: "apk.wileyriley.com"
      tinyauth.apps.apkpipe.oauth.groups: "media_admin,full_admin"
      tinyauth.apps.apkpipe.path.allow: "^/(api|health|mcp)"

      # Homelab Dashboard Portal
      portal.apkpipe.name: "APKPipe"
      portal.apkpipe.description: "Automated APK & RSS media pipeline with Real-Debrid, AllDebrid, and Nextcloud."
      portal.apkpipe.category: "Media Management"
      portal.apkpipe.icon: "fa-brands fa-android"
      portal.apkpipe.color: "#10b981"

      # Uptime Kuma Monitoring (AutoKuma)
      kuma.apkpipe.http.name: "APKPipe"
      kuma.apkpipe.http.url: "https://apk.wileyriley.com"
      kuma.apkpipe.http.group: "- Media"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - net_webservices
      - net_media

networks:
  default:
    name: apkpipe_net
  net_webservices:
    external: true
  net_media:
    external: true
