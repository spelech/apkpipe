<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}APKPipe - Automated APK Pipeline{% endblock %}</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81'
            }
          }
        }
      }
    }
  </script>

  <!-- Alpine.js Core and Collapse Plugin -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Custom Stylesheet & JS -->
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Toast Notification System -->
  <div x-data="toastStore()" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
    <template x-for="t in toasts" :key="t.id">
      <div 
        x-transition:enter="transition ease-out duration-300 transform"
        x-transition:enter-start="opacity-0 translate-y-[-10px] scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-200 transform"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        :class="{
          'border-emerald-500/40 bg-emerald-950/90 text-emerald-200': t.type === 'success',
          'border-rose-500/40 bg-rose-950/90 text-rose-200': t.type === 'error',
          'border-amber-500/40 bg-amber-950/90 text-amber-200': t.type === 'warning',
          'border-indigo-500/40 bg-slate-900/90 text-indigo-200': t.type === 'info'
        }"
        class="pointer-events-auto flex items-center justify-between p-4 rounded-xl border shadow-xl backdrop-blur-md text-sm font-medium">
        <div class="flex items-center gap-3">
          <template x-if="t.type === 'success'">
            <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          </template>
          <template x-if="t.type === 'error'">
            <svg class="w-5 h-5 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </template>
          <template x-if="t.type === 'warning'">
            <svg class="w-5 h-5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          </template>
          <template x-if="t.type === 'info'">
            <svg class="w-5 h-5 text-indigo-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </template>
          <span x-text="t.message"></span>
        </div>
        <button @click="remove(t.id)" class="text-slate-400 hover:text-slate-200 ml-3">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    </template>
  </div>

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Logo & Branding -->
        <div class="flex items-center gap-8">
          <a href="/" class="flex items-center gap-3 group">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
              <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9993.4482.9993.9993s-.4483.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993s-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1523-.5676.416.416 0 00-.5676.1523l-2.0223 3.503C15.5902 8.4116 13.8533 8.087 12 8.087s-3.5902.3246-5.1367.8629L4.841 5.4469a.416.416 0 00-.5676-.1523.416.416 0 00-.1523.5676l1.9973 3.4592C2.6889 11.1867.3431 14.6589 0 18.7778h24c-.3431-4.1189-2.6889-7.5911-6.1185-9.4564"/>
              </svg>
            </div>
            <div class="flex flex-col">
              <span class="text-lg font-bold bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent tracking-tight">APKPipe</span>
              <span class="text-[10px] uppercase font-mono tracking-widest text-indigo-400 -mt-1">Media Pipeline</span>
            </div>
          </a>

          <!-- Main Desktop Navigation -->
          <nav class="hidden md:flex items-center space-x-1">
            <a href="/" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium {% if active_page == 'dashboard' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
              Dashboard
            </a>
            <a href="/watchlist" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium {% if active_page == 'watchlist' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
              Watchlist
            </a>
            <a href="/feeds" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium {% if active_page == 'feeds' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
              Feeds
            </a>
            <a href="/history" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium {% if active_page == 'history' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
              Queue & History
            </a>
            <a href="/settings" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium {% if active_page == 'settings' %}bg-indigo-600/20 text-indigo-400 border border-indigo-500/30{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
              Settings
            </a>
          </nav>
        </div>

        <!-- Right Header Actions -->
        <div class="flex items-center gap-3">
          <a href="/docs" target="_blank" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            API Docs
          </a>
        </div>
      </div>
    </div>
    
    <!-- Mobile Navigation Submenu -->
    <div class="md:hidden flex items-center justify-around py-2 border-t border-slate-800/80 bg-slate-950/60 text-xs">
      <a href="/" class="p-2 {% if active_page == 'dashboard' %}text-indigo-400 font-semibold{% else %}text-slate-400{% endif %}">Dashboard</a>
      <a href="/watchlist" class="p-2 {% if active_page == 'watchlist' %}text-indigo-400 font-semibold{% else %}text-slate-400{% endif %}">Watchlist</a>
      <a href="/feeds" class="p-2 {% if active_page == 'feeds' %}text-indigo-400 font-semibold{% else %}text-slate-400{% endif %}">Feeds</a>
      <a href="/history" class="p-2 {% if active_page == 'history' %}text-indigo-400 font-semibold{% else %}text-slate-400{% endif %}">History</a>
      <a href="/settings" class="p-2 {% if active_page == 'settings' %}text-indigo-400 font-semibold{% else %}text-slate-400{% endif %}">Settings</a>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-950 text-slate-500 py-6 text-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>APKPipe v0.1.0 • Autonomous Homelab Ingestion</span>
      </div>
      <div class="flex items-center gap-4 text-slate-400">
        <span>Real-Debrid & JDownloader Enabled</span>
        <span>•</span>
        <a href="https://github.com/spelech/apkpipe" target="_blank" class="hover:text-slate-200 underline">GitHub</a>
      </div>
    </div>
  </footer>

</body>
</html>
