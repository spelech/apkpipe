[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apkpipe"
version = "0.1.0"
description = "Automated APK & RSS media pipeline with Real-Debrid, JDownloader fallback, Nextcloud ingestion, Web UI, and MCP server."
readme = "README.md"
authors = [
    { name = "Steve Pelech" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.28",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "packaging>=24.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=src/apkpipe --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["src/apkpipe"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
